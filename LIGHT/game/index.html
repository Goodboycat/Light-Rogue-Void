<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Light Rogue Void</title>
    <style>
      body {
        font-family: 'Rajdhani', sans-serif;
        background-color: #020617; /* slate-950 */
        color: #e2e8f0;
        overflow: hidden;
        touch-action: none; /* Prevent browser handling of gestures */
        -webkit-user-select: none;
        user-select: none;
      }
      /* (7B) mobile: fill the dynamic viewport, no tap flash / callout, safe-area helpers */
      html, body, #root { height: 100%; height: 100dvh; width: 100%; margin: 0; overscroll-behavior: none; }
      * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
      canvas { display: block; touch-action: none; }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .px-safe { padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
      /* landscape phones (height < 500px): HUD tucks into the corners, bottom strip stays clear of the thumbs */
      @media (orientation: landscape) and (max-height: 500px) {
        #hud-vitals { top: 0.5rem !important; left: 0.5rem !important; padding: 0.25rem 0.5rem !important; gap: 0.25rem !important; }
        #hud-wave { top: 0.25rem !important; transform: translateX(-50%) scale(0.8) !important; transform-origin: top center; }
        #hud-matter { top: 0.5rem !important; right: 0.5rem !important; padding: 0.25rem 0.5rem !important; }
        #burst-meter { top: 2.9rem !important; right: 0.5rem !important; width: 6rem !important; }
        #hud-phrases { bottom: 0.25rem !important; max-width: 40vw !important; }
        #story-caption { bottom: 3.5rem !important; }
        #story-caption > div { max-width: 50vw !important; }
        #touch-dash, #burst-button { bottom: calc(env(safe-area-inset-bottom, 0px) + 5.5rem) !important; }
        #touch-pause { top: calc(env(safe-area-inset-top, 0px) + 2.9rem) !important; }
      }
      .font-tech {
        font-family: 'Orbitron', sans-serif;
      }
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
